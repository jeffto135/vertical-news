<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Vertical News Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang HK", sans-serif;
      color: #FFFFFF;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 限制只容納單行寬度的垂直視窗 */
    .vertical-window {
      width: 60px; /* 單行寬度，文字不會換行並排 */
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /* 垂直走字軌道：正向直立、強制單直行 */
    .ticker-track {
      position: absolute;
      top: 0;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 5px;
      font-size: 26px;
      font-weight: 600;
      white-space: nowrap; /* 絕對不換行，只保持一直條 */
      display: inline-block;
      animation: scrollUp 90s linear infinite; /* 可按長度調整秒數 */
    }

    .news-item {
      display: inline;
      margin-bottom: 120px; /* 每段新聞之間的垂直留白 */
    }

    /* 由畫面最下方垂直平滑向上滾動 */
    @keyframes scrollUp {
      0% {
        transform: translateY(100vh);
      }
      100% {
        transform: translateY(-100%);
      }
    }
  </style>
</head>
<body>
  <div class="vertical-window">
    <div id="ticker" class="ticker-track">
      <span class="news-item">◆ 正在加載即時新聞...</span>
    </div>
  </div>

  <script>
    const RTHK_RSS = 'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml';

    async function loadRSS() {
      try {
        const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
        if (!res.ok) throw new Error('RSS fetch failed');
        const data = await res.json();

        if (data.items && data.items.length > 0) {
          const container = document.getElementById('ticker');
          container.innerHTML = '';

          // 取 20 則最新即時新聞
          data.items.slice(0, 20).forEach(item => {
            const span = document.createElement('span');
            span.className = 'news-item';

            // 將半形標點轉全形，直排視覺更端正
            const cleanTitle = item.title
              .replace(/,/g, '，')
              .replace(/:/g, '：')
              .replace(/!/g, '！')
              .replace(/\?/g, '？')
              .replace(/\s+/g, ' ');

            span.innerText = '◆ ' + cleanTitle;
            container.appendChild(span);
          });
        }
      } catch (e) {
        console.warn('RSS load retry...', e);
      }
    }

    loadRSS();
    // 每 5 分鐘自動更新新聞列表
    setInterval(loadRSS, 300000);
  </script>
</body>
</html>

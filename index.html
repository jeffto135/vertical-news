<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Vertical News Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang HK", sans-serif;
      color: #FFFFFF;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 直向長條容器 */
    .vertical-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7); /* 半透明黑底 */
    }

    /* 核心直立走字軌道 */
    .ticker-track {
      position: absolute;
      /* 關鍵設定：文字由上而下，所有中文字保持直立正向，不再側躺 */
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 5px;
      font-size: 26px;
      font-weight: 600;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      animation: scrollUp 50s linear infinite;
    }

    .news-item {
      margin-bottom: 90px; /* 每段新聞之間的間距 */
      display: inline-block;
    }

    /* 由下往上平滑滾動 */
    @keyframes scrollUp {
      0% {
        transform: translateY(100vh);
      }
      100% {
        transform: translateY(-100%);
      }
    }
  </style>
</head>
<body>
  <div class="vertical-container">
    <div id="ticker" class="ticker-track">
      <span class="news-item">正在加載即時新聞...</span>
    </div>
  </div>

  <script>
    // 你的 RTHK 香港電台即時本地新聞 RSS
    const RTHK_RSS = 'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml';

    async function loadRSS() {
      try {
        // 透過 rss2json API 轉換，解決 BrightSign 跨域 CORS 問題
        const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
        if (!res.ok) throw new Error('RSS fetch failed');
        const data = await res.json();

        if (data.items && data.items.length > 0) {
          const container = document.getElementById('ticker');
          container.innerHTML = '';

          data.items.slice(0, 20).forEach(item => {
            const span = document.createElement('span');
            span.className = 'news-item';
            // 將半形標點轉全形，直排視覺更工整
            const cleanTitle = item.title
              .replace(/,/g, '，')
              .replace(/:/g, '：')
              .replace(/!/g, '！')
              .replace(/\?/g, '？')
              .replace(/\s+/g, ' ');

            span.innerText = '◆ ' + cleanTitle;
            container.appendChild(span);
          });
        }
      } catch (e) {
        console.warn('RSS load retry...', e);
      }
    }

    loadRSS();
    // 每 5 分鐘自動抓取最新 RTHK 新聞
    setInterval(loadRSS, 300000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Vertical News Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 55px;
      height: 1920px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang HK", sans-serif;
    }

    /* 55px 寬、1920px 高視窗 */
    .vertical-window {
      width: 55px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.75);
    }

    /* 核心走字軌道：正向直立、單行、無縫銜接 */
    #ticker-track {
      position: absolute;
      left: 0;
      top: 0;
      width: 55px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap !important;
      letter-spacing: 5px;
      font-size: 40px; /* 維持 40px 大字 */
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      will-change: transform;
    }

    .news-group {
      display: inline !important;
    }

    .news-item {
      display: inline !important;
      margin-bottom: 0;
      padding-bottom: 140px; /* 每段新聞之間的適當間距 */
    }

    /* 無縫循環核心：只滾動剛好一個 Group 的長度即重置，畫面永遠不留空 */
    @keyframes seamlessScroll {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(var(--scroll-distance, -50%));
      }
    }
  </style>
</head>
<body>
  <div class="vertical-window">
    <div id="ticker-track">
      <!-- Group 1 -->
      <span id="group1" class="news-group">
        <span class="news-item">◆ 正在加載即時新聞...</span>
      </span>
      <!-- Group 2（緊接在 Group 1 後面，達成無縫咬合） -->
      <span id="group2" class="news-group">
        <span class="news-item">◆ 正在加載即時新聞...</span>
      </span>
    </div>
  </div>

  <script>
    const RTHK_RSS = 'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml';

    async function loadRSS() {
      let items = [];

      try {
        const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            items = data.items.map(i => i.title);
          }
        }
      } catch (e) {
        console.warn('API 1 fallback...', e);
      }

      if (items.length === 0) {
        try {
          const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            const parser = new DOMParser();
            const xml = parser.parseFromString(data.contents, 'text/xml');
            const titleNodes = xml.querySelectorAll('item > title');
            titleNodes.forEach(node => items.push(node.textContent));
          }
        } catch (e) {
          console.warn('API 2 error:', e);
        }
      }

      if (items.length > 0) {
        const g1 = document.getElementById('group1');
        const g2 = document.getElementById('group2');
        const track = document.getElementById('ticker-track');

        let htmlContent = '';
        items.slice(0, 15).forEach(title => {
          const cleanTitle = title
            .replace(/,/g, '，')
            .replace(/:/g, '：')
            .replace(/!/g, '！')
            .replace(/\?/g, '？')
            .replace(/\s+/g, ' ');

          htmlContent += '<span class="news-item">◆ ' + cleanTitle + '  </span>';
        });

        // 兩組放入相同新聞
        g1.innerHTML = htmlContent;
        g2.innerHTML = htmlContent;

        // 計算滾動距離：剛好等於 Group 1 的精確垂直像素高度
        setTimeout(() => {
          const g1Height = g1.offsetHeight || g1.getBoundingClientRect().height;
          track.style.setProperty('--scroll-distance', `-${g1Height}px`);

          // 速度控制：40px 字體建議每字約 0.65 秒，平穩好讀
          const totalChars = g1.innerText.length;
          const duration = Math.max(120, Math.round(totalChars * 0.8));
          track.style.animation = `seamlessScroll ${duration}s linear infinite`;
        }, 150);
      }
    }

    loadRSS();
    // 每 5 分鐘自動刷新一次最新新聞
    setInterval(loadRSS, 300000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Vertical News Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 55px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang HK", sans-serif;
    }

    /* 55px 寬、1080px 高視窗 */
    .vertical-window {
      width: 55px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.75);
    }

    /* 核心軌道：鎖死單直行，禁止折行產生第二列 */
    #ticker {
      position: absolute;
      left: 0;
      top: 1080px;
      width: 55px;
      /* 關鍵：強制不折行 */
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap !important;
      max-height: none !important;
      height: auto !important;
      
      letter-spacing: 4px;
      font-size: 24px;
      font-weight: 600;
      color: #FFFFFF;
      text-align: center;
      animation: verticalScroll 60s linear infinite;
    }

    .news-item {
      display: inline !important; /* 確保所有新聞連續串接在同一條線上 */
      margin-bottom: 0;
      padding-bottom: 90px; /* 每段新聞之間的垂直留白 */
    }

    /* 由 1080px 底端單行垂直滑出頂端 */
    @keyframes verticalScroll {
      0% {
        top: 1080px;
        transform: translateY(0);
      }
      100% {
        top: 0;
        transform: translateY(-100%);
      }
    }
  </style>
</head>
<body>
  <div class="vertical-window">
    <div id="ticker">
      <span class="news-item">◆ 正在加載即時新聞...</span>
    </div>
  </div>

  <script>
    const RTHK_RSS = 'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml';

    async function loadRSS() {
      let items = [];

      try {
        const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            items = data.items.map(i => i.title);
          }
        }
      } catch (e) {
        console.warn('API 1 error, trying fallback...', e);
      }

      if (items.length === 0) {
        try {
          const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            const parser = new DOMParser();
            const xml = parser.parseFromString(data.contents, 'text/xml');
            const titleNodes = xml.querySelectorAll('item > title');
            titleNodes.forEach(node => items.push(node.textContent));
          }
        } catch (e) {
          console.warn('API 2 error:', e);
        }
      }

      if (items.length > 0) {
        const container = document.getElementById('ticker');
        container.innerHTML = '';

        items.slice(0, 15).forEach(title => {
          const span = document.createElement('span');
          span.className = 'news-item';
          const cleanTitle = title
            .replace(/,/g, '，')
            .replace(/:/g, '：')
            .replace(/!/g, '！')
            .replace(/\?/g, '？')
            .replace(/\s+/g, ' ');

          span.innerText = '◆ ' + cleanTitle + '  ';
          container.appendChild(span);
        });

        const totalChars = container.innerText.length;
        const duration = Math.max(45, Math.round(totalChars * 0.28));
        container.style.animationDuration = duration + 's';
      }
    }

    loadRSS();
    setInterval(loadRSS, 300000);
  </script>
</body>
</html>

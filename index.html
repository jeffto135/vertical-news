<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Vertical News Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang HK", sans-serif;
    }

    /* 置中單行視窗 */
    .vertical-window {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
    }

    /* 正向直立單行走字軌道 */
    #ticker {
      position: absolute;
      top: 100%;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 6px;
      font-size: 26px;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
      height: auto;
      animation: verticalScroll 60s linear infinite;
    }

    .news-item {
      display: inline-block;
      margin-bottom: 80px; /* 每則新聞的垂直間隔 */
    }

    /* 由底部滑入，往頂部滑出 */
    @keyframes verticalScroll {
      0% {
        top: 100vh;
        transform: translateY(0);
      }
      100% {
        top: 0;
        transform: translateY(-100%);
      }
    }
  </style>
</head>
<body>
  <div class="vertical-window">
    <div id="ticker">
      <div class="news-item">◆ 正在加載香港電台即時新聞...</div>
    </div>
  </div>

  <script>
    const RTHK_RSS = 'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml';

    async function loadRSS() {
      let items = [];

      // 嘗試代理 1：rss2json
      try {
        const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            items = data.items.map(i => i.title);
          }
        }
      } catch (e) {
        console.warn('API 1 error, trying fallback...', e);
      }

      // 嘗試代理 2：allorigins (備援)
      if (items.length === 0) {
        try {
          const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            const parser = new DOMParser();
            const xml = parser.parseFromString(data.contents, 'text/xml');
            const titleNodes = xml.querySelectorAll('item > title');
            titleNodes.forEach(node => items.push(node.textContent));
          }
        } catch (e) {
          console.warn('API 2 error:', e);
        }
      }

      // 渲染新聞
      if (items.length > 0) {
        const container = document.getElementById('ticker');
        container.innerHTML = '';

        items.slice(0, 15).forEach(title => {
          const div = document.createElement('div');
          div.className = 'news-item';
          const cleanTitle = title
            .replace(/,/g, '，')
            .replace(/:/g, '：')
            .replace(/!/g, '！')
            .replace(/\?/g, '？')
            .replace(/\s+/g, ' ');

          div.innerText = '◆ ' + cleanTitle;
          container.appendChild(div);
        });

        // 根據文字長度動態調整動畫時間（每 10 個字約 3 秒，保持平穩閱讀速度）
        const totalChars = container.innerText.length;
        const duration = Math.max(40, Math.round(totalChars * 0.3));
        container.style.animationDuration = duration + 's';
      }
    }

    loadRSS();
    // 每 5 分鐘刷新最新新聞
    setInterval(loadRSS, 300000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Vertical News Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 55px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang HK", sans-serif;
    }

    /* 55px 寬、1080px 高視窗 */
    .vertical-window {
      width: 55px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.75);
    }

    /* 核心軌道：字體加大、置中、極慢速平滑走字 */
    #ticker {
      position: absolute;
      left: 0;
      top: 1080px;
      width: 55px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap !important;
      max-height: none !important;
      height: auto !important;
      
      letter-spacing: 5px;
      font-size: 40px; /* 字體加大至 30px */
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      /* 預設初速大幅放慢（150秒） */
      animation: verticalScroll 150s linear infinite;
    }

    .news-item {
      display: inline !important;
      margin-bottom: 0;
      padding-bottom: 120px; /* 每段新聞之間的間隔拉闊 */
    }

    /* 由 1080px 底部極慢速往頂部滑出 */
    @keyframes verticalScroll {
      0% {
        top: 1080px;
        transform: translateY(0);
      }
      100% {
        top: 0;
        transform: translateY(-100%);
      }
    }
  </style>
</head>
<body>
  <div class="vertical-window">
    <div id="ticker">
      <span class="news-item">◆ 正在加載即時新聞...</span>
    </div>
  </div>

  <script>
    const RTHK_RSS = 'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml';

    async function loadRSS() {
      let items = [];

      try {
        const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            items = data.items.map(i => i.title);
          }
        }
      } catch (e) {
        console.warn('API 1 error, trying fallback...', e);
      }

      if (items.length === 0) {
        try {
          const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(RTHK_RSS) + '&_t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            const parser = new DOMParser();
            const xml = parser.parseFromString(data.contents, 'text/xml');
            const titleNodes = xml.querySelectorAll('item > title');
            titleNodes.forEach(node => items.push(node.textContent));
          }
        } catch (e) {
          console.warn('API 2 error:', e);
        }
      }

      if (items.length > 0) {
        const container = document.getElementById('ticker');
        container.innerHTML = '';

        items.slice(0, 15).forEach(title => {
          const span = document.createElement('span');
          span.className = 'news-item';
          const cleanTitle = title
            .replace(/,/g, '，')
            .replace(/:/g, '：')
            .replace(/!/g, '！')
            .replace(/\?/g, '？')
            .replace(/\s+/g, ' ');

          span.innerText = '◆ ' + cleanTitle + '  ';
          container.appendChild(span);
        });

        // 慢速計算公式：每 10 個字約需 6.5 秒，速度極之平穩易讀
        const totalChars = container.innerText.length;
        const duration = Math.max(120, Math.round(totalChars * 0.65));
        container.style.animationDuration = duration + 's';
      }
    }

    loadRSS();
    setInterval(loadRSS, 300000);
  </script>
</body>
</html>
